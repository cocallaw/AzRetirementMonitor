name: Publish to PowerShell Gallery

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Module to PowerShell Gallery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
      
      - name: Verify Module Manifest
        shell: pwsh
        run: |
          $manifestPath = "./AzRetirementMonitor.psd1"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "Module manifest not found at: $manifestPath"
            exit 1
          }
          
          $manifest = Test-ModuleManifest -Path $manifestPath
          Write-Host "Module: $($manifest.Name)"
          Write-Host "Version: $($manifest.Version)"
          Write-Host "Author: $($manifest.Author)"
          Write-Host "Description: $($manifest.Description)"
      
      - name: Install PSScriptAnalyzer (Pre-publish validation)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      
      - name: Run PSScriptAnalyzer (Pre-publish validation)
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.FullName -notmatch '[/\\]Tests[/\\]' }
          if ($scriptFiles) {
            $results = $scriptFiles | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings PSGallery }
          } else {
            $results = @()
          }
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Warning "PSScriptAnalyzer found $($results.Count) issue(s). Review before publishing."
            exit 1
          } else {
            Write-Host "No issues found by PSScriptAnalyzer"
          }
      
      - name: Install Pester (Pre-publish validation)
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester Tests (Pre-publish validation)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          $testPath = "Tests/AzRetirementMonitor.Tests.ps1"
          if (Test-Path $testPath) {
            $config = New-PesterConfiguration
            $config.Run.Path = $testPath
            $config.Run.Exit = $true
            $config.Output.Verbosity = 'Detailed'
            Invoke-Pester -Configuration $config
          } else {
            Write-Error "Test file not found at: $testPath"
            exit 1
          }

      - name: Prepare Module for Publishing
        shell: pwsh
        run: |
          # Create staging directory
          $stagingDir = "./staging/AzRetirementMonitor"
          if (Test-Path $stagingDir) {
            Remove-Item -Path $stagingDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          
          # Copy only the files needed for the module
          Copy-Item -Path "./AzRetirementMonitor.psd1" -Destination $stagingDir -Force
          Copy-Item -Path "./AzRetirementMonitor.psm1" -Destination $stagingDir -Force
          Copy-Item -Path "./LICENSE" -Destination $stagingDir -Force
          Copy-Item -Path "./README.md" -Destination $stagingDir -Force
          Copy-Item -Path "./images" -Destination $stagingDir -Recurse -Force
          Copy-Item -Path "./Public" -Destination $stagingDir -Recurse -Force
          Copy-Item -Path "./Private" -Destination $stagingDir -Recurse -Force

          $unexpectedFiles = Get-ChildItem -Path $stagingDir -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[/\\](AzRetirementMonitor\.psd1|AzRetirementMonitor\.psm1|LICENSE|README\.md|images[/\\].+|Public[/\\].+|Private[/\\].+)$'
            }
          if ($unexpectedFiles) {
            $unexpectedFiles | Select-Object -ExpandProperty FullName
            throw "The staging directory contains files outside the module allowlist."
          }

          if (Get-ChildItem -Path $stagingDir -Recurse -Directory |
              Where-Object { $_.Name -in @('Tests', '.github', 'staging') }) {
            throw "Development and repository metadata directories must not be packaged."
          }
          
          Write-Host "Module staged successfully at: $stagingDir"
          Get-ChildItem -Path $stagingDir -Recurse | Select-Object FullName
      
      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:PSGALLERY_API_KEY)) {
            Write-Error "PowerShell Gallery API Key not found. Please set PSGALLERY_API_KEY secret in repository settings."
            exit 1
          }
          
          $publishParams = @{
            Path        = "./staging/AzRetirementMonitor"
            NuGetApiKey = $env:PSGALLERY_API_KEY
            Repository  = "PSGallery"
            Verbose     = $true
          }
          
          try {
            Publish-Module @publishParams
            Write-Host "Module published successfully to PowerShell Gallery"
          } catch {
            Write-Error "Failed to publish module: $_"
            exit 1
          }
